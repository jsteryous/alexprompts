name: Greenville Deed Records

# Refreshes the deed-record FINDINGS dataset (src/data/greenvilleRecords.json):
# parcel-assembly clusters, countywide portfolio holders, and the repeat-sale
# index. Unlike the buyer's list, which reports individual sales, this looks for
# patterns across the county's whole 18-year history. Nothing on the site imports
# it yet; it exists as the research input the content engines and Alex read when
# picking a story, so a refresh here is cheap and never breaks a page.
#
# Both findings are immune to the county's ~4-month recording lag because they
# measure multi-year patterns. Weekly is generous; the numbers barely move.
# Same public ArcGIS service as collect-commercial.yml. No secrets, no paid API.
# See scripts/greenville/CLAUDE.md.

on:
  schedule:
    # Sunday 22:30 UTC, half an hour after the commercial + housing collectors so
    # the three pushes do not race each other for the same branch.
    - cron: '30 22 * * 0'
  workflow_dispatch: # manual trigger from the GitHub UI

permissions:
  contents: write # needed to push the refreshed dataset back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ai-news.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-ai-news.txt

      - name: Analyze Greenville deed records
        working-directory: scripts
        run: |
          python -m greenville.records \
            --json-out ../src/data/greenvilleRecords.json

      - name: Commit the refreshed findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/greenvilleRecords.json
          if git diff --cached --quiet; then
            echo "No findings change; nothing to commit."
          else
            git commit -m "chore(greenville): refresh deed-record findings [skip ci]"
            git push
          fi
